<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bearded Dragon Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dragon Tracker" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --card: #0f3460;
      --accent: #e94560;
      --accent2: #f5a623;
      --accent3: #4ecdc4;
      --text: #eaeaea;
      --muted: #8892b0;
      --border: #233554;
      --input-bg: #0d2137;
      --success: #4ecdc4;
      --danger: #e94560;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header .dragon-icon { font-size: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.85rem; }

    nav {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    nav button {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.2s, border-color 0.2s;
    }
    nav button.active {
      color: var(--text);
      border-bottom-color: var(--accent2);
    }
    nav button:hover:not(.active) { color: var(--text); }

    main { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }

    .section { display: none; }
    .section.active { display: block; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .section-header h2 { font-size: 1.2rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent2); }
    textarea { resize: vertical; min-height: 70px; }
    select option { background: var(--input-bg); }

    .btn {
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent2); color: #1a1a2e; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-size: 0.8rem; padding: 0.25rem 0.6rem; }

    .log-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .log-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .log-item .info { flex: 1; min-width: 0; }
    .log-item .info .title { font-size: 0.95rem; font-weight: 600; }
    .log-item .info .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
    .log-item .info .notes { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; font-style: italic; }
    .log-item .date-badge {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 0.3rem;
    }
    .tag-green { background: #1a3a2e; color: var(--accent3); }
    .tag-orange { background: #3a2a0e; color: var(--accent2); }
    .tag-red { background: #3a0e1a; color: var(--accent); }

    .chart-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .chart-container canvas { max-height: 280px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent2); }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    .temp-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .temp-val {
      background: var(--input-bg);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
    }
    .temp-val .lbl { font-size: 0.7rem; color: var(--muted); }

    @media (max-width: 600px) {
      main { padding: 1rem 0.75rem; }
      .form-grid { grid-template-columns: 1fr; }
      .temp-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <span class="dragon-icon">🦎</span>
  <div>
    <h1>Bearded Dragon Tracker</h1>
    <p>Feeding &bull; Weight &bull; Temperatures</p>
  </div>
</header>

<nav id="nav">
  <button class="active" data-tab="feeding">🍽 Feeding</button>
  <button data-tab="weight">⚖️ Weight</button>
  <button data-tab="temps">🌡 Temperatures</button>
</nav>

<main>

  <div id="tab-feeding" class="section active">
    <div class="section-header"><h2>Feeding Log</h2></div>
    <div class="card">
      <div class="form-grid">
        <div><label>Date</label><input type="date" id="feed-date" /></div>
        <div><label>Time</label><input type="time" id="feed-time" /></div>
        <div>
          <label>Food Type</label>
          <select id="feed-type">
            <option>Dubia Roaches</option><option>Crickets</option><option>Mealworms</option>
            <option>Superworms</option><option>Hornworms</option><option>Collard Greens</option>
            <option>Mustard Greens</option><option>Turnip Greens</option><option>Butternut Squash</option>
            <option>Kale</option><option>Mixed Salad</option><option>Other</option>
          </select>
        </div>
        <div><label>Quantity / Amount</label><input type="text" id="feed-qty" placeholder="e.g. 10 roaches, 1 cup" /></div>
        <div>
          <label>Category</label>
          <select id="feed-category">
            <option value="insects">Insects (live)</option><option value="greens">Greens / Veggies</option>
            <option value="supplements">Supplements</option><option value="treats">Treats</option>
          </select>
        </div>
        <div>
          <label>Eaten?</label>
          <select id="feed-eaten">
            <option value="all">All eaten</option><option value="most">Most eaten</option>
            <option value="some">Some eaten</option><option value="refused">Refused</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:0.75rem"><label>Notes</label><textarea id="feed-notes" placeholder="Optional notes..."></textarea></div>
      <button class="btn btn-primary" onclick="addFeeding()">Add Entry</button>
    </div>
    <div id="feeding-stats" class="stats-row"></div>
    <div id="feeding-list" class="log-list"></div>
  </div>

  <div id="tab-weight" class="section">
    <div class="section-header"><h2>Weight Log</h2></div>
    <div class="card">
      <div class="form-grid">
        <div><label>Date</label><input type="date" id="weight-date" /></div>
        <div><label>Weight (grams)</label><input type="number" id="weight-value" placeholder="e.g. 320" min="0" step="0.1" /></div>
      </div>
      <div style="margin-bottom:0.75rem"><label>Notes</label><textarea id="weight-notes" placeholder="Optional notes..."></textarea></div>
      <button class="btn btn-primary" onclick="addWeight()">Add Entry</button>
    </div>
    <div id="weight-stats" class="stats-row"></div>
    <div class="chart-container" id="weight-chart-container" style="display:none"><canvas id="weight-chart"></canvas></div>
    <div id="weight-list" class="log-list"></div>
  </div>

  <div id="tab-temps" class="section">
    <div class="section-header"><h2>Temperature Log</h2></div>
    <div class="card">
      <div class="form-grid">
        <div><label>Date</label><input type="date" id="temp-date" /></div>
        <div><label>Time</label><input type="time" id="temp-time" /></div>
        <div><label>Basking Spot (°F)</label><input type="number" id="temp-basking" placeholder="100-115°F" step="0.1" /></div>
        <div><label>Warm Side (°F)</label><input type="number" id="temp-warm" placeholder="85-95°F" step="0.1" /></div>
        <div><label>Cool Side (°F)</label><input type="number" id="temp-cool" placeholder="75-85°F" step="0.1" /></div>
        <div><label>UVB Reading (optional)</label><input type="number" id="temp-uvb" placeholder="UVI e.g. 3.0" step="0.1" /></div>
      </div>
      <div style="margin-bottom:0.75rem"><label>Notes</label><textarea id="temp-notes" placeholder="Optional notes..."></textarea></div>
      <button class="btn btn-primary" onclick="addTemp()">Add Entry</button>
    </div>
    <div id="temp-stats" class="stats-row"></div>
    <div id="temp-list" class="log-list"></div>
  </div>

</main>

<script>
const load = key => JSON.parse(localStorage.getItem(key) || '[]');
const save = (key, data) => localStorage.setItem(key, JSON.stringify(data));
const FEED_KEY = 'bd_feedings', WEIGHT_KEY = 'bd_weights', TEMP_KEY = 'bd_temps';
function today() { return new Date().toISOString().slice(0, 10); }
function nowTime() { const d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
function fmtDate(d) { const [y,m,day] = d.split('-'); return `${m}/${day}/${y}`; }
function fmtDateTime(d, t) { return t ? `${fmtDate(d)} ${t}` : fmtDate(d); }
document.querySelectorAll('#nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});
window.addEventListener('load', () => {
  document.getElementById('feed-date').value = today();
  document.getElementById('feed-time').value = nowTime();
  document.getElementById('weight-date').value = today();
  document.getElementById('temp-date').value = today();
  document.getElementById('temp-time').value = nowTime();
  renderAll();
});
function addFeeding() {
  const date=document.getElementById('feed-date').value,time=document.getElementById('feed-time').value,
    type=document.getElementById('feed-type').value,qty=document.getElementById('feed-qty').value.trim(),
    category=document.getElementById('feed-category').value,eaten=document.getElementById('feed-eaten').value,
    notes=document.getElementById('feed-notes').value.trim();
  if (!date||!type){alert('Please fill in date and food type.');return;}
  const feedings=load(FEED_KEY);feedings.unshift({id:Date.now(),date,time,type,qty,category,eaten,notes});
  save(FEED_KEY,feedings);document.getElementById('feed-qty').value='';document.getElementById('feed-notes').value='';renderFeedings();
}
function deleteFeeding(id){save(FEED_KEY,load(FEED_KEY).filter(f=>f.id!==id));renderFeedings();}
function renderFeedings(){
  const feedings=load(FEED_KEY),list=document.getElementById('feeding-list'),stats=document.getElementById('feeding-stats');
  const total=feedings.length,thisWeek=feedings.filter(f=>(new Date()-new Date(f.date))/86400000<=7).length,refused=feedings.filter(f=>f.eaten==='refused').length;
  stats.innerHTML=total===0?'':`<div class="stat-card"><div class="value">${total}</div><div class="label">Total Feedings</div></div><div class="stat-card"><div class="value">${thisWeek}</div><div class="label">This Week</div></div><div class="stat-card"><div class="value">${refused}</div><div class="label">Refused</div></div>`;
  if(feedings.length===0){list.innerHTML='<div class="empty-state"><div class="icon">🍽</div>No feedings logged yet.</div>';return;}
  const eatenColor={all:'tag-green',most:'tag-green',some:'tag-orange',refused:'tag-red'},catColor={insects:'tag-orange',greens:'tag-green',supplements:'tag-green',treats:'tag-orange'};
  list.innerHTML=feedings.map(f=>`<div class="log-item"><div class="info"><div class="title">${f.type}${f.qty?' — '+f.qty:''}</div><div class="meta"><span class="tag ${catColor[f.category]||'tag-green'}">${f.category}</span><span class="tag ${eatenColor[f.eaten]||'tag-orange'}">${f.eaten}</span></div>${f.notes?`<div class="notes">${esc(f.notes)}</div>`:''}</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem"><span class="date-badge">${fmtDateTime(f.date,f.time)}</span><button class="btn btn-danger" onclick="deleteFeeding(${f.id})">Delete</button></div></div>`).join('');
}
let weightChart=null;
function addWeight(){
  const date=document.getElementById('weight-date').value,value=parseFloat(document.getElementById('weight-value').value),notes=document.getElementById('weight-notes').value.trim();
  if(!date||isNaN(value)||value<=0){alert('Please enter a valid date and weight.');return;}
  const weights=load(WEIGHT_KEY);weights.push({id:Date.now(),date,value,notes});weights.sort((a,b)=>a.date.localeCompare(b.date));save(WEIGHT_KEY,weights);
  document.getElementById('weight-value').value='';document.getElementById('weight-notes').value='';renderWeights();
}
function deleteWeight(id){save(WEIGHT_KEY,load(WEIGHT_KEY).filter(w=>w.id!==id));renderWeights();}
function renderWeights(){
  const weights=load(WEIGHT_KEY),list=document.getElementById('weight-list'),stats=document.getElementById('weight-stats'),chartContainer=document.getElementById('weight-chart-container');
  if(weights.length===0){stats.innerHTML='';chartContainer.style.display='none';list.innerHTML='<div class="empty-state"><div class="icon">⚖️</div>No weight entries yet.</div>';return;}
  const latest=weights[weights.length-1].value,first=weights[0].value,change=(latest-first).toFixed(1),changePfx=change>0?'+':'';
  const min=Math.min(...weights.map(w=>w.value)).toFixed(1),max=Math.max(...weights.map(w=>w.value)).toFixed(1);
  stats.innerHTML=`<div class="stat-card"><div class="value">${latest}g</div><div class="label">Current Weight</div></div><div class="stat-card"><div class="value" style="color:${change>=0?'var(--accent3)':'var(--accent)'}">${changePfx}${change}g</div><div class="label">Total Change</div></div><div class="stat-card"><div class="value">${min}g</div><div class="label">Min Recorded</div></div><div class="stat-card"><div class="value">${max}g</div><div class="label">Max Recorded</div></div>`;
  chartContainer.style.display='block';
  if(weightChart){weightChart.destroy();}
  weightChart=new Chart(document.getElementById('weight-chart'),{type:'line',data:{labels:weights.map(w=>fmtDate(w.date)),datasets:[{label:'Weight (g)',data:weights.map(w=>w.value),borderColor:'#f5a623',backgroundColor:'rgba(245,166,35,0.1)',borderWidth:2,pointRadius:4,pointBackgroundColor:'#f5a623',tension:0.3,fill:true}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8892b0'},grid:{color:'#233554'}},y:{ticks:{color:'#8892b0',callback:v=>v+'g'},grid:{color:'#233554'}}}}});
  list.innerHTML=[...weights].reverse().map(w=>`<div class="log-item"><div class="info"><div class="title">${w.value} grams</div>${w.notes?`<div class="notes">${esc(w.notes)}</div>`:''}</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem"><span class="date-badge">${fmtDate(w.date)}</span><button class="btn btn-danger" onclick="deleteWeight(${w.id})">Delete</button></div></div>`).join('');
}
function addTemp(){
  const date=document.getElementById('temp-date').value,time=document.getElementById('temp-time').value,
    basking=parseFloat(document.getElementById('temp-basking').value)||null,warm=parseFloat(document.getElementById('temp-warm').value)||null,
    cool=parseFloat(document.getElementById('temp-cool').value)||null,uvb=parseFloat(document.getElementById('temp-uvb').value)||null,
    notes=document.getElementById('temp-notes').value.trim();
  if(!date||(!basking&&!warm&&!cool)){alert('Please enter a date and at least one temperature.');return;}
  const temps=load(TEMP_KEY);temps.unshift({id:Date.now(),date,time,basking,warm,cool,uvb,notes});save(TEMP_KEY,temps);
  ['temp-basking','temp-warm','temp-cool','temp-uvb','temp-notes'].forEach(id=>document.getElementById(id).value='');
  renderTemps();
}
function deleteTemp(id){save(TEMP_KEY,load(TEMP_KEY).filter(t=>t.id!==id));renderTemps();}
const RANGES={basking:[100,115],warm:[85,95],cool:[75,85]};
function tempStatus(val,range){if(val===null)return '';return(val<range[0]||val>range[1])?'tag-red':'tag-green';}
function renderTemps(){
  const temps=load(TEMP_KEY),list=document.getElementById('temp-list'),stats=document.getElementById('temp-stats');
  if(temps.length===0){stats.innerHTML='';list.innerHTML='<div class="empty-state"><div class="icon">🌡</div>No temperature readings yet.</div>';return;}
  const last=temps[0];
  stats.innerHTML=`${last.basking!=null?`<div class="stat-card"><div class="value" style="color:var(--accent)">${last.basking}°F</div><div class="label">Last Basking</div></div>`:''} ${last.warm!=null?`<div class="stat-card"><div class="value" style="color:var(--accent2)">${last.warm}°F</div><div class="label">Last Warm Side</div></div>`:''} ${last.cool!=null?`<div class="stat-card"><div class="value" style="color:var(--accent3)">${last.cool}°F</div><div class="label">Last Cool Side</div></div>`:''} ${last.uvb!=null?`<div class="stat-card"><div class="value" style="color:#a29bfe">${last.uvb}</div><div class="label">Last UVI</div></div>`:''}`;
  list.innerHTML=temps.map(t=>`<div class="log-item"><div class="info"><div class="temp-row">${t.basking!=null?`<div class="temp-val"><div class="lbl">Basking</div><span class="tag ${tempStatus(t.basking,RANGES.basking)}">${t.basking}°F</span></div>`:''} ${t.warm!=null?`<div class="temp-val"><div class="lbl">Warm Side</div><span class="tag ${tempStatus(t.warm,RANGES.warm)}">${t.warm}°F</span></div>`:''} ${t.cool!=null?`<div class="temp-val"><div class="lbl">Cool Side</div><span class="tag ${tempStatus(t.cool,RANGES.cool)}">${t.cool}°F</span></div>`:''} ${t.uvb!=null?`<div class="temp-val"><div class="lbl">UVI</div><span class="tag tag-green">${t.uvb}</span></div>`:''}</div>${t.notes?`<div class="notes" style="margin-top:0.4rem">${esc(t.notes)}</div>`:''}</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.4rem"><span class="date-badge">${fmtDateTime(t.date,t.time)}</span><button class="btn btn-danger" onclick="deleteTemp(${t.id})">Delete</button></div></div>`).join('');
}
function renderAll(){renderFeedings();renderWeights();renderTemps();}
function esc(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
